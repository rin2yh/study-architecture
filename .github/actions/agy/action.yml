name: agy
description: antigravity CLI を導入し、プロンプトを 1 回実行する

inputs:
  api-key:
    description: Gemini API キー (Google AI Studio で発行し Secrets に置く)
    required: true
  prompt-file:
    description: agy へ渡すプロンプトのファイル
    required: true

runs:
  using: composite
  steps:
    - name: check api key
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.api-key }}
      # inputs の required は実行時に効かないため、install の前にここで落とす。
      run: |
        if [ -z "$GEMINI_API_KEY" ]; then
          echo "GEMINI_API_KEY が未登録です"
          exit 1
        fi

    - name: install agy
      shell: bash
      # 配布物のバージョン固定とチェックサム検証は未対応 (GitHub #144)。
      run: |
        curl -fsSL https://antigravity.google/cli/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: configure agy
      shell: bash
      # agy は $HOME 直下しか設定を読まないため、リポジトリの設定をそこへ写す。
      run: |
        mkdir -p "$HOME/.gemini/antigravity-cli"
        cp "$GITHUB_WORKSPACE/.github/antigravity/settings.json" "$HOME/.gemini/antigravity-cli/settings.json"

    - name: run agy
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.api-key }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
      run: agy --model gemini-3.6-flash --mode accept-edits -p "$(cat "$PROMPT_FILE")" 2>&1 | tee "$RUNNER_TEMP/agy-out.txt"

