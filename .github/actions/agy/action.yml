name: agy
description: antigravity CLI を導入し、プロンプトを 1 回実行する

inputs:
  api-key:
    description: Gemini API キー (Google AI Studio で発行し Secrets に置く)
    required: true
  prompt-file:
    description: agy へ渡すプロンプトのファイル
    required: true

runs:
  using: composite
  steps:
    - name: check api key
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.api-key }}
      # inputs の required は実行時に効かないため、install の前にここで落とす。
      run: |
        if [ -z "$GEMINI_API_KEY" ]; then
          echo "GEMINI_API_KEY が未登録です"
          exit 1
        fi

    - name: install agy
      shell: bash
      # 配布物のバージョン固定とチェックサム検証は未対応 (GitHub #144)。
      run: |
        curl -fsSL https://antigravity.google/cli/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: configure agy
      shell: bash
      # 環境変数だけでは sign-in を要求される。modelProvider の指定と併用が要る (CLI v1.1.13)。
      run: |
        mkdir -p "$HOME/.gemini/antigravity-cli"
        echo '{"modelProvider": "gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"

    - name: debug agy
      shell: bash
      run: |
        agy --version || true
        agy models || true

    - name: run agy
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.api-key }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
      run: agy -p "$(cat "$PROMPT_FILE")"

    - name: debug agy logs
      if: always()
      shell: bash
      run: |
        for f in "$HOME"/.gemini/antigravity-cli/crashes/*.log "$HOME"/.gemini/antigravity-cli/log/*.log; do
          echo "===== $f"
          tail -100 "$f" || true
        done
