name: Docs (freshness)

# 当面は手動実行のみ (ADR-[[202608150859]])。トリガの昇格は GitHub #144。
on:
  workflow_dispatch:

concurrency:
  # 同じブランチへ出すため、走っている実行があれば打ち切る。
  group: docs-freshness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: docs/refresh
      SUBJECT: 直近 1 週間の変更を実装に追従させる
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # サードパーティの CLI を同じランナーで動かすため、token を残置せず push 直前に入れる。
          persist-credentials: false

      - name: プロンプトを組み立てる
        run: |
          # 全件渡すとプロンプトが膨らむので頭打ちにする。
          # 変更が .md だけだと grep が 1 を返し、-e で step ごと落ちるため || true で受ける。
          changed=$(git log --since="1 week ago" --name-only --format= | grep -v '\.md$' | sort -u | head -60 || true)

          # 作業ツリーに置くと書き込み範囲の検査に引っかかるため、ランナーの一時領域に置く。
          {
            cat .github/antigravity/prompt.md
            echo
            echo "変わった実装ファイル:"
            echo "$changed"
          } > "${{ runner.temp }}/prompt.txt"

      - uses: ./.github/actions/agy
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          prompt-file: ${{ runner.temp }}/prompt.txt

      - name: 書き換えた範囲を確認する
        run: |
          bad=""
          for file in $(git diff --name-only) $(git ls-files --others --exclude-standard); do
            case "$file" in
              doc/adr/*) bad="$bad $file" ;;
              *.md) ;;
              *) bad="$bad $file" ;;
            esac
          done

          if [ -n "$bad" ]; then
            echo "許可パス外を書き換えました:$bad"
            exit 1
          fi

      - name: 変更をコミットして push する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 終了コードでは成否を判定できない (ADR-[[202608150859]])。
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "docs: $SUBJECT"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f -u origin "$BRANCH"

          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: draft PR を作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PUSHED" ]; then
            echo "push していないため PR は作りません"
            exit 0
          fi

          # 実行のたびに PR が増えると読まれなくなるので、open な PR があれば push だけで更新する。
          if gh pr view "$BRANCH" > /dev/null 2>&1; then
            echo "既存の draft PR を更新しました"
            exit 0
          fi

          gh pr create --draft --base main --head "$BRANCH" --title "docs: $SUBJECT" \
            --body "antigravity CLI (Gemini) による自動更新です。実装との突合をレビューしてください。"
