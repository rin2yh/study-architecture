name: Docs (freshness)

# 当面は手動実行だけに絞る。schedule / pull_request への昇格は手動実行での実測後に別途行う。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "docs-agent が更新する対象ドキュメント (空なら決定的レーンだけ回す)"
        default: ""

concurrency:
  group: docs-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 参照リンクの検査
        run: bash scripts/docs/lint-refs.sh

      - name: サービス表と compose.yaml の突合
        run: bash scripts/docs/gen-service-table.sh --check

  docs-sync:
    name: docs-sync
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 生成物を実装に追従させる
        run: bash scripts/docs/gen-service-table.sh --write

      - name: 追従後も参照が壊れていないことを確認
        run: bash scripts/docs/lint-refs.sh

      - name: draft PR を作る / 更新する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/docs/open-pr.sh docs/auto-refresh "生成ドキュメントを実装に追従させる" "compose.yaml から生成しているサービス表が実装と乖離していたため更新します。"

  docs-agent:
    name: docs-agent
    # GEMINI_API_KEY 未登録だと必ず落ちるため、対象を明示したときだけ動かす。
    if: ${{ inputs.target != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # この job だけサードパーティの CLI を同一ランナーで動かすため、token を残置しない
          # (push 直前に open-pr.sh が入れる)。
          persist-credentials: false

      # 配布物のバージョン固定とチェックサム検証は未対応。リリース資産名を確認したうえで
      # 差し替えるまで、この job は workflow_dispatch 限定にしておく。
      - name: antigravity CLI を入れる
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Gemini API を直接使う設定を置く
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cp .github/antigravity/settings.json "$HOME/.gemini/antigravity-cli/settings.json"

      - name: 対象ドキュメントを更新する
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/docs/agent-fix.sh "${{ inputs.target }}"

      - name: 参照が壊れていないことを確認
        run: bash scripts/docs/lint-refs.sh

      - name: draft PR を作る / 更新する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/docs/open-pr.sh docs/auto-refresh-agent "${{ inputs.target }} を実装に追従させる" "agy による自動更新です。実装ファイルとの突合をレビューしてください。"
