name: Docs (freshness)

# 当面は手動実行だけに絞る。schedule / pull_request への昇格は実測後に行う (GitHub #144)。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "docs-agent が更新する対象ドキュメント (空なら参照検査だけ回す)"
        default: ""

concurrency:
  group: docs-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: ADR 参照が実在するか確認する
        run: |
          missing=$(git grep -hoI -E 'ADR-\[\[[0-9]{12}\]\]' | grep -oE '[0-9]{12}' | sort -u |
            while read -r id; do ls doc/adr/"$id"-*.md >/dev/null 2>&1 || echo "$id"; done)
          [ -z "$missing" ] || { echo "実在しない ADR を参照しています: $missing" >&2; exit 1; }

  docs-agent:
    name: docs-agent
    # GEMINI_API_KEY 未登録だと必ず落ちるため、対象を明示したときだけ動かす。
    if: ${{ inputs.target != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET: ${{ inputs.target }}
      BRANCH: docs/auto-refresh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # サードパーティの CLI を同じランナーで動かすため、token を残置せず push 直前に入れる。
          persist-credentials: false

      # 配布物のバージョン固定とチェックサム検証は未対応 (GitHub #144)。
      - name: antigravity CLI を入れる
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Gemini API を直接使う設定を置く
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cp .github/antigravity/settings.json "$HOME/.gemini/antigravity-cli/settings.json"

      - name: 対象ドキュメントを更新する
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          since=$(git log -1 --format=%cI -- "$TARGET")
          changed=$(git log --since="$since" --name-only --format= -- . ':(exclude)*.md' | sort -u | head -60)
          agy -p "$TARGET を実装の現状に合わせて更新してください。

          - 書き換えてよいのは $TARGET だけです。他のファイルは触らないでください。
          - doc/adr/ の新規作成と Status 変更は禁止です。設計判断は人が起こします。
          - 実装を読んで裏が取れたことだけ書いてください。推測で書かないでください。
          - 変更が不要なら何も書き換えないでください。

          $TARGET の最終更新以降に変わった実装ファイル:
          $changed"

          # agy は承認を得られないツールを soft-deny して exit 0 で素通りするため、差分で判定する。
          touched=$(git status --porcelain | cut -c4-)
          if [ -n "$touched" ] && [ "$touched" != "$TARGET" ]; then
            echo "許可パス外を書き換えたため破棄します: $touched" >&2
            git checkout -- . && git clean -fdq
            exit 1
          fi

      - name: draft PR を作る / 更新する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet && { echo "変更なし"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "docs: $TARGET を実装に追従させる"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f -u origin "$BRANCH"
          # 実行のたびに PR が増えると読まれなくなるので、open な PR があれば push だけで更新する。
          gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' | grep -q . && exit 0
          gh pr create --draft --base main --head "$BRANCH" \
            --title "docs: $TARGET を実装に追従させる" \
            --body "agy による自動更新です。実装との突合をレビューしてください。

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
