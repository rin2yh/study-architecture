name: Docs (freshness)

# 当面は手動実行のみ (ADR-[[202608150859]])。トリガの昇格は GitHub #144。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "更新する対象ドキュメント (空なら直近 1 週間の実装変更を関係するドキュメントへ反映する)"

concurrency:
  # 対象ごとに別ブランチへ出すため、別対象の実行は打ち切らない。
  group: docs-freshness-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: ADR 参照が実在するか確認する
        run: |
          referenced=$(git grep -hoI -E 'ADR-\[\[[0-9]{12}\]\]' | tr -dc '0-9\n' | sort -u)
          existing=$(ls doc/adr | cut -c1-12 | sort -u)
          missing=$(comm -23 <(echo "$referenced") <(echo "$existing"))
          [ -z "$missing" ] || { echo "実在しない ADR を参照しています: $missing" >&2; exit 1; }

  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # サードパーティの CLI を同じランナーで動かすため、token を残置せず push 直前に入れる。
          persist-credentials: false

      # 配布物のバージョン固定とチェックサム検証は未対応 (GitHub #144)。
      - name: antigravity CLI を入れる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "GEMINI_API_KEY が未登録です" >&2; exit 1; }
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Gemini API を直接使う設定を置く
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cp .github/antigravity/settings.json "$HOME/.gemini/antigravity-cli/settings.json"

      - name: ドキュメントを実装に追従させる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$TARGET" ]; then
            since=$(git log -1 --format=%cI -- "$TARGET")
            instruction="$TARGET を実装の現状に合わせて更新してください。"
          else
            # 対象を選ばず「溜まったズレを均す」のが常用。1 週間ぶんなら差分がレビューできる量に収まる。
            since="1 week ago"
            instruction="下の変更に関係するドキュメントだけを更新してください。関係しないものは触らないでください。"
          fi

          # 全件渡すとプロンプトが膨らむため頭打ちにする。足りなければ実行を分ける。
          changed=$(git log --since="$since" --name-only --format= -- . ':(exclude)*.md' | sort -u | head -60)
          agy -p "$instruction

          - 書き換えてよいのは Markdown のドキュメントだけです。実装ファイルは触らないでください。
          - doc/adr/ は読むだけで、新規作成も Status 変更も禁止です。設計判断は人が起こします。
          - 実装を読んで裏が取れたことだけ書いてください。推測で書かないでください。
          - 変更が不要なら何も書き換えないでください。

          変わった実装ファイル (最大 60 件):
          $changed"

          # 終了コードでは成否を判定できない (ADR-[[202608150859]])。
          touched=$(git status --porcelain | cut -c4-)
          if [ -n "$touched" ]; then
            bad=$(printf '%s\n' "$touched" | awk '!/\.md$/ || /^doc\/adr\//')
            [ -z "$bad" ] || { echo "許可パス外を書き換えました: $bad" >&2; exit 1; }
          fi

      - name: draft PR を作る / 更新する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet && { echo "変更なし"; exit 0; }
          subject="${TARGET:-直近 1 週間の変更}を実装に追従させる"
          # 対象ごとにブランチを分ける。共有すると別対象の PR を force push で潰す。
          branch="docs/refresh-$(printf '%s' "${TARGET:-weekly}" | tr '/.' '--')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -qam "docs: $subject"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f -u origin "$branch"
          # 実行のたびに PR が増えると読まれなくなるので、open な PR があれば push だけで更新する。
          gh pr view "$branch" >/dev/null 2>&1 && exit 0
          gh pr create --draft --base main --head "$branch" --title "docs: $subject" \
            --body "antigravity CLI (Gemini) による自動更新です。実装との突合をレビューしてください。"
