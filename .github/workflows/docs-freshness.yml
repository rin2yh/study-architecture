name: Docs (freshness)

# 当面は手動実行のみ (ADR-[[202608150859]])。トリガの昇格は GitHub #144。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "更新する対象ドキュメント (空なら直近 1 週間の実装変更を関係するドキュメントへ反映する)"

concurrency:
  # 対象ごとに別ブランチへ出すため、別対象の実行は打ち切らない。
  group: docs-freshness-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: ADR 参照が実在するか確認する
        run: |
          missing=""
          for id in $(git grep -ho -E 'ADR-\[\[[0-9]{12}\]\]' | grep -o -E '[0-9]{12}' | sort -u); do
            if ! ls doc/adr/"$id"-*.md > /dev/null 2>&1; then
              missing="$missing $id"
            fi
          done

          if [ -n "$missing" ]; then
            echo "実在しない ADR を参照しています:$missing"
            exit 1
          fi
          echo "ADR 参照 OK"

  update:
    # 壊れた参照のまま高価なエージェント実行と PR 作成をしないよう、検査の後に回す。
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # サードパーティの CLI を同じランナーで動かすため、token を残置せず push 直前に入れる。
          persist-credentials: false

      - name: プロンプトを組み立てる
        run: |
          if [ -n "$TARGET" ]; then
            since=$(git log -1 --format=%cI -- "$TARGET")
            instruction="$TARGET を実装の現状に合わせて更新してください。"
          else
            # 対象を選ばず「溜まったズレを均す」のが常用。1 週間ぶんならレビューできる量に収まる。
            since="1 week ago"
            instruction="下の変更に関係するドキュメントだけを更新してください。関係しないものは触らないでください。"
          fi

          # --format= はコミット行を出さないため。全件渡すとプロンプトが膨らむので頭打ちにする。
          # 変更が .md だけだと grep が 1 を返し、-e で step ごと落ちるため || true で受ける。
          changed=$(git log --since="$since" --name-only --format= | grep -v '\.md$' | sort -u | head -60 || true)

          # 作業ツリーに置くと書き込み範囲の検査に引っかかるため、ランナーの一時領域に置く。
          {
            echo "$instruction"
            echo
            cat .github/antigravity/prompt.md
            echo
            echo "変わった実装ファイル:"
            echo "$changed"
          } > "${{ runner.temp }}/prompt.txt"

      - uses: ./.github/actions/agy
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          prompt-file: ${{ runner.temp }}/prompt.txt

      - name: 書き換えた範囲を確認する
        run: |
          bad=""
          for file in $(git diff --name-only) $(git ls-files --others --exclude-standard); do
            case "$file" in
              doc/adr/*) bad="$bad $file" ;;
              *.md) ;;
              *) bad="$bad $file" ;;
            esac
          done

          if [ -n "$bad" ]; then
            echo "許可パス外を書き換えました:$bad"
            exit 1
          fi

      - name: draft PR を作る / 更新する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 終了コードでは成否を判定できない (ADR-[[202608150859]])。
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi

          if [ -n "$TARGET" ]; then
            # パス区切りをそのまま使うと refs/heads が入れ子になり、既存ブランチと衝突して作れない。
            branch="docs/refresh-$(echo "$TARGET" | tr '/' '-')"
            subject="$TARGET を実装に追従させる"
          else
            branch="docs/refresh-weekly"
            subject="直近 1 週間の変更を実装に追従させる"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "docs: $subject"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f -u origin "$branch"

          # 実行のたびに PR が増えると読まれなくなるので、open な PR があれば push だけで更新する。
          if gh pr view "$branch" > /dev/null 2>&1; then
            echo "既存の draft PR を更新しました"
            exit 0
          fi

          gh pr create --draft --base main --head "$branch" --title "docs: $subject" \
            --body "antigravity CLI (Gemini) による自動更新です。実装との突合をレビューしてください。"
