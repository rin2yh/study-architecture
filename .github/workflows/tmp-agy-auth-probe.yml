name: TMP agy auth probe

# provider ごとに使えるモデルが変わるか調べるための一時ワークフロー。調査後に消す。
on:
  push:
    branches:
      - claude/document-update-strategy-t1vqkf

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: install agy
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gemini provider のモデル一覧
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          echo '{"modelProvider": "gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"
          agy models || true

      - name: provider 指定なしのモデル一覧
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo '{}' > "$HOME/.gemini/antigravity-cli/settings.json"
          agy models || true
