name: TMP agy model probe

# 一覧に出ないモデル ID が --model で通るか調べるための一時ワークフロー。調査後に消す。
on:
  push:
    branches:
      - claude/document-update-strategy-t1vqkf

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: install agy
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: configure agy
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          echo '{"modelProvider": "gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: flash-lite の候補を順に試す
        run: |
          for model in gemini-3.1-flash-lite gemini-3.1-flash-lite-preview gemini-flash-lite-latest; do
            echo "===== $model"
            agy --model "$model" -p "ping" < /dev/null 2>&1 | tail -3 || true
          done
